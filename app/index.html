<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Recipes</title>
  <meta name="description" content="A personal recipe collection.">
  <meta name="theme-color" content="#FAFAFA" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E0E0E" media="(prefers-color-scheme: dark)">
  <script>var t = null; try { t = JSON.parse(localStorage.getItem('recipes.theme')); } catch (e) {} if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; document.documentElement.dataset.theme = t;</script>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="preload" href="fonts/bricolage-grotesque-latin-opsz-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <link rel="modulepreload" href="app.js">
  <link rel="preload" href="data/recipes.json" as="fetch" crossorigin>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar">
    <a class="brand" href="#/" data-brand>Recipes</a>
    <div class="top-right">
      <button class="theme-btn" id="theme" type="button"></button>
      <div class="account" id="account"></div>
    </div>
  </header>
  <main id="main" tabindex="-1">
    <p class="loading">Loading recipes…</p>
  </main>
  <footer class="foot" id="foot"></footer>
  <aside class="side" id="side" aria-label="Shopping list" hidden></aside>
  <nav class="tabbar" id="tabbar" aria-label="Main" hidden></nav>
  <div class="timers" id="timers" aria-live="polite"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <dialog class="modal" id="modal"></dialog>
  <script type="module" src="app.js"></script>
</body>
</html>
